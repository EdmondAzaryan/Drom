<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grand Auto</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#eaebef;color:#333;font-size:13px;overflow-x:hidden;width:100%}
header{background:#1c1c1e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;height:55px;position:sticky;top:0;z-index:100}
.h-left{display:flex;align-items:center;gap:10px}
.back-btn{color:#3b99fc;font-weight:bold;cursor:pointer;background:none;border:none;font-size:12px;display:none}
.logo{display:flex;align-items:center;gap:5px;font-size:18px;font-weight:800}
.logo-ic{background:#e31e24;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:12px;font-style:italic}
.logo span{color:#e31e24}
.h-right{display:flex;align-items:center;gap:8px}
.bal{text-align:right;line-height:1.1;margin-right:5px}
.bal-amt{font-size:14px;font-weight:bold}
.bal-lbl{font-size:9px;color:#e31e24;font-weight:bold}
.btn-t{padding:7px 10px;border-radius:4px;border:none;font-weight:600;font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer}
.btn-dark{background:#4a4a4a;color:#fff}
.btn-red{background:#e31e24;color:#fff}
.container{padding:10px;width:100%;max-width:1200px;margin:0 auto}
.page{display:none}.page.active{display:block}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.step-txt{font-size:14px;color:#666}
.cars-list{display:flex;gap:10px;flex-wrap:wrap}
.sell-card{background:#fff;border-radius:6px;padding:10px;width:calc(50% - 5px);display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
.sell-card img{height:60px;object-fit:contain;margin-bottom:5px}
.sell-card .card-title{font-size:12px;width:100%;text-align:left}
.cfg-block{background:#fff;border-radius:6px;padding:15px;margin-bottom:10px}
.cfg-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cfg-lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.check{color:#e31e24;font-size:16px}
.cfg-cost{color:#999;font-weight:bold;font-size:14px}
.days-grp{display:flex;gap:5px}
.day-btn{width:35px;height:35px;border:none;border-radius:4px;background:#e5e5e5;font-weight:bold;font-size:12px;color:#555;cursor:pointer}
.day-btn.active{background:#e31e24;color:#fff}
.price-inp{width:100%;padding:12px;background:#d5d7db;border:none;border-radius:4px;font-size:14px;outline:none;text-align:right}
.total-row{display:flex;justify-content:space-between;align-items:center;margin:15px 0;font-size:14px;color:#555}
.total-row strong{color:#000;font-size:18px}
.btn-pub{width:100%;padding:14px;background:#d5d7db;color:#999;border:none;border-radius:4px;font-size:15px;font-weight:bold;cursor:not-allowed}
.btn-pub.ready{background:#e31e24;color:#fff;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:6px;font-weight:bold;opacity:0;pointer-events:none;transition:.3s;z-index:2000;font-size:12px}
#toast.show{opacity:1;bottom:30px}
</style>
</head>
<body>

<header>
<div class="h-left">
<button class="back-btn" id="h-back" onclick="goBack()">‹ Назад</button>
<div class="logo"><div class="logo-ic">e</div><div>grand<span>auto</span></div></div>
</div>
<div class="h-right">
<div class="bal"><div class="bal-amt" id="u-bal">5 000 000$</div><div class="bal-lbl">БАЛАНС</div></div>
<button class="btn-t btn-dark" onclick="showPage('page-my')">📄 Мои</button>
<button class="btn-t btn-red" onclick="openSellMenu()">➕ Подать</button>
</div>
</header>

<div id="page-main" class="container page active">
<h2 style="text-align:center; margin-top: 20px;">Главная (Авторынок)</h2>
</div>

<div id="page-my" class="container page">
<h2 style="text-align:center; margin-top: 20px;">Мои объявления</h2>
</div>

<div id="page-step1" class="container page">
<div class="step-head"><button class="btn-t btn-dark" onclick="goBack()">Назад</button><div class="step-txt"><b>Шаг 1/2</b><br>Выберите автомобиль, который хотите продать</div></div>
<div class="cars-list" id="garage-grid">
    <div style="text-align:center; width:100%; padding:20px; color:#888;">Загрузка...</div>
</div>
</div>

<div id="page-step2" class="container page">
<div class="step-head"><button class="btn-t btn-dark" onclick="showPage('page-step1')">Назад</button><div class="step-txt"><b>Шаг 2/2</b><br>Настройте детали</div></div>
<div class="cfg-block">
<div class="cfg-row"><div class="cfg-lbl"><span class="check">✔</span> Срок размещения</div><div class="days-grp"><button class="day-btn active" onclick="selDays(this,1)">1</button><button class="day-btn" onclick="selDays(this,2)">2</button><button class="day-btn" onclick="selDays(this,3)">3</button></div></div>
<div class="cfg-row" style="justify-content:flex-end"><span class="cfg-cost" id="days-cost">+5 000$</span></div>
</div>
<div class="cfg-block"><div class="cfg-lbl" style="font-weight:400;margin-bottom:10px">Цена продажи</div><input type="number" class="price-inp" id="sell-price" value="0" placeholder="0" oninput="checkPrice()"></div>
<div class="total-row">К оплате <strong id="total-cost">5 000$</strong></div>
<button class="btn-pub" id="pub-btn" onclick="confirmPub()">Опубликовать</button>
</div>

<div id="toast">Текст</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Берем ID из ссылки, как в примере 2048
const urlParams = new URLSearchParams(window.location.search);
const USER_ID = parseInt(urlParams.get('uid')) || tg.initDataUnsafe?.user?.id || 1;

// Ссылка на наш локальный сервер (Flask)
// Если тестируешь на телефоне, замени 127.0.0.1 на IP компьютера (напр. 192.168.1.5)
const SERVER_URL = "http://127.0.0.1:8000"; 

let myCars = []; 
let sellCar = null, selDaysVal = 1, hist = ['page-main'];

function money(a) { return a.toLocaleString('ru-RU') + '$'; }
function toast(m) { let t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); if(hist[hist.length-1]!==id) hist.push(id); document.getElementById('h-back').style.display = id==='page-main'?'none':'block'; window.scrollTo(0,0); }
function goBack() { if(hist.length>1){ hist.pop(); let prev=hist[hist.length-1]; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(prev).classList.add('active'); document.getElementById('h-back').style.display=prev==='page-main'?'none':'block'; } else showPage('page-main'); }

// ЗАГРУЗКА МАШИН ИЗ БАЗЫ (ТОЧНО КАК В 2048)
function openSellMenu() {
    showPage('page-step1');
    let g = document.getElementById('garage-grid');
    g.innerHTML = '<div style="text-align:center; width:100%; padding:20px; color:#888;">Загрузка из базы...</div>';
    
    fetch(`${SERVER_URL}/api/my_cars?user_id=${USER_ID}`)
        .then(res => res.json())
        .then(data => {
            myCars = data; 
            if(myCars.length === 0) {
                g.innerHTML = '<div style="text-align:center; width:100%; padding:20px; color:#888;">У вас нет машин</div>';
                return;
            }
            g.innerHTML = myCars.map(c => `
                <div class="sell-card" onclick="startSell('${c.name}')">
                    <img src="https://w7.pngwing.com/pngs/344/457/png-transparent-mercedes-benz-w124-mercedes-benz-w201-car-mercedes-benz-c-class-mercedes-compact-car-sedan-car.png">
                    <div class="card-title">${c.name}</div>
                    <div style="font-size:10px; color:#888; align-self:flex-start;">⚡ ${c.speed} км/ч · ⭐ ${c.stars}</div>
                </div>
            `).join('');
        })
        .catch(err => {
            g.innerHTML = '<div style="text-align:center; width:100%; padding:20px; color:red;">Ошибка сети. Проверь IP сервера.</div>';
        });
}

function startSell(name) { sellCar=name;selDaysVal=1;document.querySelectorAll('.day-btn').forEach((b,i)=>{if(i===0)b.classList.add('active');else b.classList.remove('active')});updPrice(1);document.getElementById('sell-price').value='0';document.getElementById('pub-btn').classList.remove('ready');showPage('page-step2'); }
function selDays(btn,d) { document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selDaysVal=d;updPrice(d); }
function updPrice(d) { let c=d*5000;document.getElementById('days-cost').textContent='+'+money(c);document.getElementById('total-cost').textContent=money(c); }
function checkPrice() { let p=parseInt(document.getElementById('sell-price').value)||0,b=document.getElementById('pub-btn');if(p>0){b.classList.add('ready');b.disabled=false}else{b.classList.remove('ready');b.disabled=true} }

function confirmPub() { 
    let p=parseInt(document.getElementById('sell-price').value)||0;
    if(p<=0)return;
    
    fetch(`${SERVER_URL}/api/sell_car`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, car_name: sellCar, price: p, days: selDaysVal })
    })
    .then(res => res.json())
    .then(data => {
        toast("✅ Объявление создано!");
        showPage('page-main');
    })
    .catch(err => {
        toast("❌ Ошибка при создании");
    });
}
</script>
</body>
</html>
